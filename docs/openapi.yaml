openapi: 3.1.0
info:
  title: Direkapin API
  version: 1.0.0
  description: |
    Kontrak API Direkapin. Backend (Fastify) dan mobile (Flutter) WAJIB mengikuti file ini.
    Perubahan kontrak harus diusulkan dulu ke owner.

    Konvensi:
    - Semua path diawali /api/v1.
    - Nominal uang = integer Rupiah (tanpa desimal).
    - Timestamp = ISO 8601 UTC (contoh 2026-11-04T02:30:00Z).
    - Tanggal = YYYY-MM-DD (zona waktu user), bulan = YYYY-MM.
    - Data milik user lain dibalas 404 NOT_FOUND.
    - Semua error memakai skema Error.
servers:
  - url: https://api.appdirekapin.my.id/api/v1
  - url: http://localhost:3000/api/v1

security:
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: me
  - name: wallets
  - name: transfers
  - name: categories
  - name: transactions
  - name: activities
  - name: attachments
  - name: calendar
  - name: reports
  - name: dashboard
  - name: archives

paths:
  /health:
    get:
      tags: [system]
      security: []
      summary: Cek server hidup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /version:
    get:
      tags: [system]
      security: []
      summary: Versi APK terbaru
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [latestVersion, downloadUrl]
                properties:
                  latestVersion: { type: string, example: 1.0.0 }
                  downloadUrl: { type: string, format: uri }

  # ---------------- Auth ----------------
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Daftar dengan kode undangan (AUTH-01, AUTH-04)
      description: Membuat user, dompet "Cash" saldo 0, dan menyalin kategori bawaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, inviteCode]
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: Wajib ada huruf dan angka }
                inviteCode: { type: string }
      responses:
        '201':
          description: Akun dibuat, langsung login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: EMAIL_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: INVITE_INVALID (salah, terpakai, atau kedaluwarsa)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login (AUTH-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Tukar refresh token (rotasi, token lama dicabut)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: REFRESH_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      security: []
      summary: Cabut refresh token (AUTH-03)
      description: Tetap 204 walau token tidak dikenal atau sudah dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Logout berhasil }

  # ---------------- Me ----------------
  /me:
    get:
      tags: [me]
      summary: Profil user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      summary: Ubah profil / jam reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                timezone: { type: string, example: Asia/Jakarta }
                reminderTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '21:00' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------- Wallets ----------------
  /wallets:
    get:
      tags: [wallets]
      summary: Daftar dompet beserta saldo terhitung (FIN-09)
      description: totalBalance hanya menjumlahkan dompet yang ada di items, jadi dompet arsip ikut dihitung hanya jika includeArchived=true.
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, totalBalance]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Wallet' }
                  totalBalance: { type: integer, description: 'Dihitung, boleh negatif' }
    post:
      tags: [wallets]
      summary: Tambah dompet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/NameTaken' }

  /wallets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [wallets]
      summary: Ubah atau arsipkan dompet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WalletInputPartial'
                - type: object
                  properties:
                    isArchived: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameTaken' }
    delete:
      tags: [wallets]
      summary: Hapus dompet (hanya jika belum ada transaksi/transfer)
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WALLET_IN_USE — arsipkan saja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------- Transfers ----------------
  /transfers:
    get:
      tags: [transfers]
      summary: Riwayat transfer
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: wallet
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transfer' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [transfers]
      summary: Transfer antar dompet (FIN-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /transfers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [transfers]
      summary: Edit transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInputPartial' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [transfers]
      summary: Hapus transfer
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Categories ----------------
  /categories:
    get:
      tags: [categories]
      summary: Daftar kategori (FIN-05)
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TxType' }
        - name: includeHidden
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [categories]
      summary: Tambah kategori custom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/NameTaken' }

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categories]
      summary: Ubah kategori (kategori bawaan hanya boleh ubah isHidden, icon, color, sortOrder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                icon: { type: string }
                color: { $ref: '#/components/schemas/HexColor' }
                isHidden: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: NAME_TAKEN, atau CATEGORY_DEFAULT jika nama kategori bawaan diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [categories]
      summary: Hapus kategori custom; transaksinya dipindah ke "Lainnya" dengan tipe sama
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CATEGORY_DEFAULT — kategori bawaan tidak bisa dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------- Transactions ----------------
  /transactions:
    get:
      tags: [transactions]
      summary: Daftar transaksi, terbaru dulu (FIN-11)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: wallet
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TxType' }
        - name: q
          in: query
          description: Cari di catatan
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [transactions]
      summary: Tambah transaksi (FIN-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [transactions]
      summary: Detail transaksi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [transactions]
      summary: Edit transaksi (FIN-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInputPartial' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [transactions]
      summary: Hapus transaksi + fotonya (FIN-04)
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Activities ----------------
  /activities:
    get:
      tags: [activities]
      summary: Daftar kegiatan
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
    post:
      tags: [activities]
      summary: Tambah kegiatan (ACT-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [activities]
      summary: Detail kegiatan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [activities]
      summary: Edit kegiatan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInputPartial' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [activities]
      summary: Hapus kegiatan + fotonya
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Attachments ----------------
  /attachments:
    post:
      tags: [attachments]
      summary: Upload foto yang sudah dikompres di HP (FIN-02, FIN-13, ACT-03)
      description: |
        Isi tepat satu dari transactionId atau activityId.
        Batas: 3 foto per transaksi, 5 per kegiatan. File > 2 MB ditolak; > 1 MB di-resize ulang.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'image/jpeg, image/png, image/webp' }
                transactionId: { type: string, format: uuid }
                activityId: { type: string, format: uuid }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: UNSUPPORTED_MEDIA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: PHOTO_LIMIT_REACHED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [attachments]
      summary: Ambil foto (butuh token)
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, full], default: full }
      responses:
        '200':
          description: File gambar
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: ARCHIVED — foto asli sudah dipindah ke arsip; ambil size=thumb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [attachments]
      summary: Hapus foto
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Calendar & day ----------------
  /calendar:
    get:
      tags: [calendar]
      summary: Penanda per tanggal dalam sebulan (CAL-01)
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
      responses:
        '200':
          description: OK. Hanya tanggal yang punya data.
          content:
            application/json:
              schema:
                type: object
                required: [month, days]
                properties:
                  month: { $ref: '#/components/schemas/Month' }
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, income, expense, activityCount, hasImportant]
                      properties:
                        date: { $ref: '#/components/schemas/Date' }
                        income: { $ref: '#/components/schemas/Money' }
                        expense: { $ref: '#/components/schemas/Money' }
                        activityCount: { type: integer }
                        hasImportant: { type: boolean }

  /days/{date}:
    get:
      tags: [calendar]
      summary: Isi Halaman Hari (CAL-03)
      parameters:
        - name: date
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Date' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [date, income, expense, transactions, transfers, activities, note]
                properties:
                  date: { $ref: '#/components/schemas/Date' }
                  income: { $ref: '#/components/schemas/Money' }
                  expense: { $ref: '#/components/schemas/Money' }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  transfers:
                    type: array
                    items: { $ref: '#/components/schemas/Transfer' }
                  activities:
                    type: array
                    description: Penting dulu, lalu jam naik, tanpa jam di akhir
                    items: { $ref: '#/components/schemas/Activity' }
                  note:
                    oneOf:
                      - $ref: '#/components/schemas/DailyNote'
                      - type: 'null'

  # ---------------- Reports ----------------
  /reports/daily:
    get:
      tags: [reports]
      summary: Laporan harian (FIN-06)
      parameters:
        - name: date
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - $ref: '#/components/parameters/WalletFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }

  /reports/weekly:
    get:
      tags: [reports]
      summary: Laporan mingguan Senin–Minggu (FIN-07)
      parameters:
        - name: start
          in: query
          required: true
          description: Tanggal Senin awal minggu
          schema: { $ref: '#/components/schemas/Date' }
        - $ref: '#/components/parameters/WalletFilter'
      responses:
        '200':
          description: OK. series = 7 hari.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /reports/monthly:
    get:
      tags: [reports]
      summary: Laporan bulanan (FIN-08)
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - $ref: '#/components/parameters/WalletFilter'
      responses:
        '200':
          description: OK. series = per hari dalam bulan, comparison terisi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }

  # ---------------- Dashboard ----------------
  /dashboard:
    get:
      tags: [dashboard]
      summary: Ringkasan beranda (DSH-01–05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [totalBalance, wallets, month, today, last7Days, streak]
                properties:
                  totalBalance: { type: integer, description: 'Dihitung, boleh negatif' }
                  wallets:
                    type: array
                    items: { $ref: '#/components/schemas/Wallet' }
                  month:
                    type: object
                    required: [income, expense, net]
                    properties:
                      income: { $ref: '#/components/schemas/Money' }
                      expense: { $ref: '#/components/schemas/Money' }
                      net: { type: integer }
                  today:
                    type: object
                    required: [date, expense, activities, hasEntry]
                    properties:
                      date: { $ref: '#/components/schemas/Date' }
                      expense: { $ref: '#/components/schemas/Money' }
                      activities:
                        type: array
                        items: { $ref: '#/components/schemas/Activity' }
                      hasEntry: { type: boolean }
                  last7Days:
                    type: array
                    items: { $ref: '#/components/schemas/SeriesPoint' }
                  streak:
                    type: object
                    required: [current, longest]
                    properties:
                      current: { type: integer }
                      longest: { type: integer }

  # ---------------- Archives ----------------
  /archives:
    get:
      tags: [archives]
      summary: Daftar arsip foto bulanan (ARC-03)
      responses:
        '200':
          description: OK, terbaru dulu
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Archive' }

  /archives/{id}/download:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [archives]
      summary: Download ZIP arsip
      description: |
        Status jadi DOWNLOADED hanya setelah stream selesai utuh; unduhan terputus tidak mengubah status.
        Respons memakai header Content-Length. ZIP bisa di-download ulang sampai expiresAt, setelah itu 410.
        Arsip berstatus FAILED belum punya ZIP dan dibalas 404.
      responses:
        '200':
          description: File ZIP
          content:
            application/zip: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: ARCHIVE_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      description: Tanggal awal inklusif (zona waktu user)
      schema: { $ref: '#/components/schemas/Date' }
    To:
      name: to
      in: query
      description: Tanggal akhir inklusif (zona waktu user)
      schema: { $ref: '#/components/schemas/Date' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Nilai nextCursor dari halaman sebelumnya
      schema: { type: string }
    WalletFilter:
      name: wallet
      in: query
      description: Kosong = semua dompet
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: UNAUTHORIZED (token tidak ada / kedaluwarsa)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: NOT_FOUND (tidak ada atau milik user lain)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NameTaken:
      description: NAME_TAKEN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: RATE_LIMITED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - REFRESH_INVALID
                - NOT_FOUND
                - EMAIL_TAKEN
                - NAME_TAKEN
                - INVITE_INVALID
                - WALLET_IN_USE
                - CATEGORY_DEFAULT
                - FILE_TOO_LARGE
                - UNSUPPORTED_MEDIA
                - PHOTO_LIMIT_REACHED
                - ARCHIVED
                - ARCHIVE_EXPIRED
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: Pesan bahasa Indonesia, aman ditampilkan ke user
            details:
              type: object
              description: 'Untuk VALIDATION_ERROR: { field: pesan }'
              additionalProperties: { type: string }
      example:
        error:
          code: VALIDATION_ERROR
          message: Data belum valid
          details:
            amount: Nominal harus lebih dari 0

    Money:
      type: integer
      minimum: 0
      description: Rupiah, tanpa desimal
    Date:
      type: string
      format: date
      example: '2026-11-04'
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: 2026-11
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    TxType:
      type: string
      enum: [INCOME, EXPENSE]
    WalletType:
      type: string
      enum: [CASH, BANK, EWALLET]

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 'Detik, contoh 900' }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, name, email, timezone, reminderTime, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        reminderTime: { type: string, example: '21:00' }
        createdAt: { type: string, format: date-time }

    WalletInput:
      type: object
      required: [name, type, icon, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        type: { $ref: '#/components/schemas/WalletType' }
        initialBalance: { type: integer, default: 0, description: Boleh negatif }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        sortOrder: { type: integer }
    WalletInputPartial:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        type: { $ref: '#/components/schemas/WalletType' }
        initialBalance: { type: integer }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        sortOrder: { type: integer }
    Wallet:
      type: object
      required: [id, name, type, initialBalance, balance, icon, color, isArchived, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/WalletType' }
        initialBalance: { type: integer }
        balance: { type: integer, description: 'Dihitung, boleh negatif' }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        isArchived: { type: boolean }
        sortOrder: { type: integer }

    TransferInput:
      type: object
      required: [fromWalletId, toWalletId, amount, occurredAt]
      properties:
        fromWalletId: { type: string, format: uuid }
        toWalletId: { type: string, format: uuid, description: Harus beda dari fromWalletId }
        amount: { type: integer, minimum: 1, maximum: 999999999 }
        occurredAt: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    TransferInputPartial:
      type: object
      properties:
        fromWalletId: { type: string, format: uuid }
        toWalletId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1, maximum: 999999999 }
        occurredAt: { type: string, format: date-time }
        note: { type: [string, 'null'], maxLength: 1000 }
    Transfer:
      type: object
      required: [id, fromWallet, toWallet, amount, occurredAt, note]
      properties:
        id: { type: string, format: uuid }
        fromWallet: { $ref: '#/components/schemas/WalletRef' }
        toWallet: { $ref: '#/components/schemas/WalletRef' }
        amount: { type: integer }
        occurredAt: { type: string, format: date-time }
        note: { type: [string, 'null'] }

    WalletRef:
      type: object
      required: [id, name, icon, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }

    CategoryInput:
      type: object
      required: [name, type, icon, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        type: { $ref: '#/components/schemas/TxType' }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
    Category:
      type: object
      required: [id, name, type, icon, color, isDefault, isHidden, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/TxType' }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        isDefault: { type: boolean }
        isHidden: { type: boolean }
        sortOrder: { type: integer }
    CategoryRef:
      type: object
      required: [id, name, icon, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }

    TransactionInput:
      type: object
      required: [walletId, categoryId, type, amount, occurredAt]
      properties:
        walletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, description: Tipe kategori harus sama dengan type }
        type: { $ref: '#/components/schemas/TxType' }
        amount: { type: integer, minimum: 1, maximum: 999999999 }
        occurredAt: { type: string, format: date-time, description: Maks. 1 tahun ke depan }
        note: { type: string, maxLength: 1000 }
    TransactionInputPartial:
      type: object
      properties:
        walletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TxType' }
        amount: { type: integer, minimum: 1, maximum: 999999999 }
        occurredAt: { type: string, format: date-time }
        note: { type: [string, 'null'], maxLength: 1000 }
    Transaction:
      type: object
      required: [id, type, amount, occurredAt, note, wallet, category, attachments, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TxType' }
        amount: { type: integer }
        occurredAt: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        wallet: { $ref: '#/components/schemas/WalletRef' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ActivityInput:
      type: object
      required: [title, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        date: { $ref: '#/components/schemas/Date' }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        location: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        isImportant: { type: boolean, default: false }
    ActivityInputPartial:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        date: { $ref: '#/components/schemas/Date' }
        time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        location: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        isImportant: { type: boolean }
    Activity:
      type: object
      required: [id, title, date, time, location, description, isImportant, attachments, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        time: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        isImportant: { type: boolean }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Attachment:
      type: object
      required: [id, thumbUrl, fullUrl, isArchived, width, height, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        thumbUrl: { type: string, description: 'Path relatif, contoh /api/v1/attachments/{id}?size=thumb' }
        fullUrl: { type: [string, 'null'], description: null jika sudah diarsip }
        isArchived: { type: boolean }
        archiveMonth: { type: [string, 'null'], description: YYYY-MM jika diarsip }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }

    DailyNote:
      type: object
      required: [date, mood, note]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        mood: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    SeriesPoint:
      type: object
      required: [label, income, expense]
      properties:
        label: { type: string, description: 'Tanggal YYYY-MM-DD (harian/mingguan/bulanan)' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }

    Report:
      type: object
      required: [period, totals, series, byCategory, comparison]
      properties:
        period:
          type: object
          required: [type, start, end]
          properties:
            type: { type: string, enum: [daily, weekly, monthly] }
            start: { $ref: '#/components/schemas/Date' }
            end: { $ref: '#/components/schemas/Date' }
        totals:
          type: object
          required: [income, expense, net, transactionCount]
          properties:
            income: { $ref: '#/components/schemas/Money' }
            expense: { $ref: '#/components/schemas/Money' }
            net: { type: integer }
            transactionCount: { type: integer }
        series:
          type: array
          description: Kosong untuk laporan harian
          items: { $ref: '#/components/schemas/SeriesPoint' }
        byCategory:
          type: array
          description: Pengeluaran per kategori, terbesar dulu
          items:
            type: object
            required: [category, amount, share]
            properties:
              category: { $ref: '#/components/schemas/CategoryRef' }
              amount: { $ref: '#/components/schemas/Money' }
              share: { type: number, description: '0–1' }
        comparison:
          description: Hanya laporan bulanan; null untuk lainnya
          oneOf:
            - type: 'null'
            - type: object
              required: [previousExpense, changePct]
              properties:
                previousExpense: { $ref: '#/components/schemas/Money' }
                changePct: { type: [number, 'null'], description: null jika bulan lalu 0 }

    Archive:
      type: object
      required: [id, month, sizeBytes, photoCount, status, createdAt, expiresAt, downloadedAt]
      properties:
        id: { type: string, format: uuid }
        month: { $ref: '#/components/schemas/Month' }
        sizeBytes: { type: integer }
        photoCount: { type: integer }
        status: { type: string, enum: [READY, DOWNLOADED, EXPIRED, FAILED], description: 'FAILED = ZIP gagal dibuat, foto asli utuh, dicoba lagi besok; sizeBytes dan photoCount 0' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        downloadedAt: { type: [string, 'null'], format: date-time }
